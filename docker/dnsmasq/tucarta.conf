# dnsmasq para el servidor del equipo: resuelve tucarta.local y cualquier
# subdominio (*.tucarta.local) hacia la IP del servidor.
# Cambia 192.168.1.50 por la IP real del servidor en la red del equipo.

address=/tucarta.local/192.168.1.50

# Todo lo demás se resuelve con los DNS normales.
server=1.1.1.1
server=8.8.8.8
